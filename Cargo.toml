[package]
name = "gemini-terminal"
version = "0.1.0"
edition = "2024"
description = "A minimal terminal client for the Gemini API"

[dependencies]
anyhow = "1"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"